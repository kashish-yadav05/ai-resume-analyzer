{% extends "base.html" %}

{% block title %}Upload Resume-AI Resume Analyzer{% endblock %}

{% block content %}
<div class="upload-container">
    <h1>Upload Your Resume</h1>

    <p>Upload your resume in PDF format to analyze your skills, education, projects and other important details.</p>
    
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="resume">Choose Resume</label>
            <input type="file" id="resume" name="resume" accept=".pdf" required>
        </div>

        <button type="submit" class="btn">Analyze Resume</button>
    </form>
</div>

{% endblock %}
